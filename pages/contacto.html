<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
    <title>Contacto | Cuerar</title>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Cuerar</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      <div class="navbar-nav">
        <a class="nav-link active" aria-current="page" href="../index.html">Home</a>
         <a class="nav-link" href="./contacto.html">Contacto</a>
         <a class="nav-link" href="./tienda.html">Tienda</a>
         <a class="nav-link" href="./login.html">Login</a>
      </div>
    </div>
  </div>
</nav>
    </header>
    <main>
        <div class="banner-contacto">
    <h2>¡Ponete en contacto con nosotros!</h2>
    <p>¡Dejanos cualquier duda que tengas aquí abajo!</p>
  </div>
    <h3>Formulario de contacto</h3>
  <section class="formulario-contacto">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-6">
            <form action="#" method="post">
              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" class="form-control" id="nombre" name="nombre" required />
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico:</label>
                <input type="email" class="form-control" id="email" name="email" required />
              </div>
              <div class="mb-3">
                <label for="mensaje" class="form-label">Mensaje:</label>
                <textarea class="form-control" id="mensaje" name="mensaje" rows="5" required></textarea>
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-primary">Enviar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
    </main>
    <footer class="bg-black py-3">
    <div class="container d-flex justify-content-center gap-3">
      <a href="https://www.instagram.com/" target="_blank"><img src="../img/instagram.png" alt="logo de instagram" /></a>
      <a href="https://x.com/?lang=es" target="_blank"><img src="../img/twitter.png" alt="logo de twitter" /></a>
      <a href="https://www.facebook.com" target="_blank"><img src="../img/facebook.png" alt="logo de facebook" /></a>
    </div>
    
  </footer>

  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../java/contacto.js"></script>
</body>
</html>
